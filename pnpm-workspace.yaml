packages:
  - 'pi-packages/*'
  - 'opencode-packages/*'

allowBuilds:
  '@ast-grep/cli': true
  '@google/genai': false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

overrides:
  hono: 4.12.19
  postcss: 8.5.14
  tsx: 4.22.4

# 4320 = 3 days in minutes
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@earendil-works/*'
  - '@anthropic-ai/claude-agent-sdk*'
  # Audited 2026-11-06: same publisher, no install scripts, matches tag v0.4.1.
  - 'cc-session-io@0.4.1'
