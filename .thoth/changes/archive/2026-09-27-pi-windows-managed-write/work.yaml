    output: Safe bounded Windows rename retries and regression evidence.
    dependsOn: []
    reads: [src/cli/pi-managed-write.ts, src/cli/pi-install.test.ts]
    writes: [src/cli/pi-managed-write.ts, src/cli/pi-managed-write.test.ts]
    resources: [repository-pi-managed-writer]
    owner:
      role: root
    checks:
      - id: focused-tests
        criterion: Transient, persistent, concurrent edit, unsafe path, cleanup and unrelated error cases pass.
        command: pnpm exec vitest run src/cli/pi-managed-write.test.ts src/cli/pi-install.test.ts src/cli/pi-resources.test.ts
      - id: static-checks
        criterion: Biome, TypeScript, build and applicable regression suite pass.
        command: pnpm run check:ci && pnpm run typecheck && pnpm run build && env -u CODEX_HOME pnpm test
      - id: native-probe
        criterion: Disposable Windows real file lock reproduces EPERM and demonstrates release recovery without touching live settings.
      - id: independent-review
        criterion: Fresh read-only Oracle judges actual diff and verified checks.
