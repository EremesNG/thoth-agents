        - {path: docs, state: preexisting, fingerprint: "sha256:8470102753466c1b549ee6a04795782938a24ff30d2c63f34282ff71e65e2ea9"}
        - {path: pi, state: preexisting, fingerprint: "sha256:e703736854385315c09cd8e7ce8e3149c6b28cfd659742d780d8365914033362"}
        - {path: scripts/verify-pi-package.mjs, state: preexisting, fingerprint: "sha256:eaf9629c6cc7cecc8278581f07c1626f8fd8c2dc23ce0aa71c598ba18bf50eef"}
    semantic:
      status: pending
  - id: child-root-boundary
    output: Ambient Thoth extension remains inert in native child processes without root injection or global synchronization.
    dependsOn: []
    reads: [src/pi.ts, src/pi.test.ts]
    writes: [src/pi.ts, src/pi.test.ts]
    resources: [repository-pi-extension]
    owner:
      role: root
    checks:
      - id: child-boundary-regression
        criterion: Native child guard regression and repeated isolated runtime probe show no root authority in children.
        command: pnpm exec vitest run src/pi.test.ts
    acceptance: [migration]
    baseline:
      status: unknown
    semantic:
      status: pending
  - id: compatibility
    output: Isolated pinned-runtime probe report distinguishing passed checks and unverified live behavior.
    dependsOn: []
    reads: [package.json]
    writes: [.thoth/changes/pi-subagents-migration/evidence/compatibility.md]
    resources: [isolated-temporary-pi-root]
