version: 1
change:
  id: pi-windows-managed-write
  title: Handle transient Windows locks during atomic Pi managed writes
agreement:
  status: approved
  source: user
  ref: User reports setup:pi:local EPERM replacing settings.json after package steps
  approvedBy: user
  fingerprint: sha256:5122f0c62596d9c5ec2068f3e1514564aca5d7b2733c7e67f36110e8de55c28a
goal: Recover safely from transient Windows rename locks during managed Pi writes without losing concurrent edits or weakening atomic replacement.
bounds:
  include:
    - Bounded Windows-only retries for transient replacement failures in writePiManagedText
    - Revalidation before every replacement attempt, actionable persistent failure, regression tests
  exclude:
    - Live installation or settings mutation, process termination, permission changes
    - In-place overwrite or unlink fallback, dependency policies and other harness writers
autonomy:
  allowed:
    - Edit managed writer and focused tests
    - Use disposable Windows file-lock probes and local checks
  requiresApproval:
    - Mutating live user configuration or terminating a process
  forbidden:
    - Overwrite a concurrently changed target or weaken symlink checks
    - Claim identification of the process behind the reported lock without evidence
acceptance:
  - id: safe-replacement
    criterion: Windows transient rename lock failures retry within a fixed bound and succeed when released; persistent failures preserve the original, clean temporary data and provide actionable diagnostics; every retry rechecks target safety and original snapshot; other errors and non-Windows paths retain fail-fast behavior.
    inputs: [src/cli/pi-managed-write.ts]
    outputs: [src/cli/pi-managed-write.ts, src/cli/pi-managed-write.test.ts]
    checks: [focused-tests, static-checks, native-probe, independent-review]
    result:
      status: accepted
      reviewedBy: root
      reviewedAt: "2026-09-27T00:44:04.580Z"
      evidence: [.thoth/changes/pi-windows-managed-write/evidence/verification.md, .thoth/changes/pi-windows-managed-write/evidence/oracle-final.md]
      evidenceFingerprint: sha256:ba5db57429ba5142425788e5eb172e52a0cb5969b7db06d1679809fc3c07e4cc
