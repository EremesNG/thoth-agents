version: 1
change:
  id: pi-global-model-panel
agreement:
  status: approved
  fingerprint: sha256:e34e283d4288d83e53aa1e30880f5de7c47c5d6a2b18730e0052ad800a485f32
  source: user
goal: Configure the six Thoth Pi specialists globally through /thoth-agents:models without leaving Pi or running the CLI.
bounds:
  include:
    - Native Pi command and keyboard-accessible model/thinking panel
    - Shared global specialist configuration service used by CLI and Pi UI
    - Live Pi model catalog and model-aware effort selection
    - Safe owned-file persistence and explicit runtime precedence diagnostics
    - Focused tests and user documentation
  exclude:
    - Profiles and project-scoped configuration
    - Ambient root model changes
    - Other harness behavior changes
    - Runtime scheduling or subagent lifecycle implementation
    - Live user configuration edits during development
    - Package installation or publication
autonomy:
  allowed:
    - Edit bounded source and tests after the planning choice
    - Run local checks and build
    - Use native fresh specialists within one-writer ownership
  requiresApproval:
    - Material product or architecture changes
    - Destructive operations or live global configuration changes
  forbidden:
    - Modifying other harness model settings
    - Committing or publishing without request
