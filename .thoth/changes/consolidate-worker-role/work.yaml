version: 1
change:
  id: consolidate-worker-role
agreement:
  status: approved
  fingerprint: sha256:a64e9736dcc37a628c97362528f5cf74cc980120982f832a7b610004a3594e36
  source: user
goal: Remove Quick and rename Deep to Worker consistently across OpenCode, Codex, Claude Code and Pi, leaving five specialists plus the orchestrator.
bounds:
  include:
    - Canonical role identity and routing without quick or deep aliases
    - Worker retains Deep implementation capabilities and receives fresh defaults rather than Deep customizations
    - Worker defaults to gpt-6-luna max in OpenCode and Codex and openai-codex/gpt-6-luna max in Pi
    - Claude Worker retains sonnet medium
    - OpenCode max validation aligned with user-observed GPT-6 Luna OpenAI variant support
    - Five-specialist inventories in native outputs and CLI and Pi model configuration
    - Safe retirement of attributable obsolete managed role assets during existing explicit setup or sync operations
    - Active documentation and specifications updated without rewriting historical records
  exclude:
    - Backward aliases or migration of quick or deep model and effort personalizations
    - Changes to other specialists or ambient root model defaults
    - Live global install or sync during development
    - External runtime scheduling or delegation implementation
    - Rewriting previous change evidence or archived history
    - Fixing unrelated marketplace fixture or environment failures
autonomy:
  allowed:
    - Edit scoped product surfaces and tests after the planning choice
    - Regenerate owned integration assets and schema through existing commands
    - Run isolated local tests and native package verification
    - Use fresh native specialists with one mutable owner per worktree
  requiresApproval:
    - Material product or architecture changes
    - Live global changes or deletion of unowned resources
    - Publishing or pushing commits
  forbidden:
    - Silently downgrading max
    - Overwriting an unowned worker resource or deleting unowned quick or deep files
    - Copying old role overrides into Worker
acceptance:
  - id: AC-roster
    criterion: The public role contract, configuration schema, prompts and routing expose orchestrator plus explorer, librarian, oracle, designer and worker; quick and deep are no longer supported roles or aliases and Worker retains write-capable Deep behavior without the old quick/deep tier split.
    inputs: [src/harness/core/agent-pack.test.ts, src/harness/core/workflow.test.ts, src/agents/index.test.ts, src/agents/prompt-rendering.test.ts, src/config]
    outputs: [src/agents, src/config, src/harness/core, thoth-agents.schema.json]
    checks: [Canonical inventory and rejection tests pass, No active old-name routing remains]
