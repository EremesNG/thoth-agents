name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch
        id: release-branch
        run: |
          for branch in main master; do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done

          for branch in origin/main origin/master; do
            if git show-ref --verify --quiet "refs/remotes/${branch}" &&
              git merge-base --is-ancestor "$GITHUB_SHA" "${branch}"; then
              release_branch="${branch#origin/}"
              echo "Release tag commit is contained in ${branch}."
              echo "name=${release_branch}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Release tags must point to commits contained in main or master."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Update npm
        run: npm install -g npm@11

      - name: Wait for CI
        id: wait-ci
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          for attempt in {1..90}; do
            runs=$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=20"
            )
            run=$(
              jq \
                --arg branch "${RELEASE_BRANCH}" \
                --arg sha "${HEAD_SHA}" \
                '.workflow_runs
                  | map(select(.head_branch == $branch and .head_sha == $sha))
                  | sort_by(.created_at)
                  | last // empty' \
                <<< "$runs"
            )

            if [ -z "$run" ]; then
              echo "CI run for ${RELEASE_BRANCH} at ${HEAD_SHA} not found yet. Waiting..."
              sleep 10
              continue
            fi

            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion // empty' <<< "$run")
            run_id=$(jq -r '.id // empty' <<< "$run")
            url=$(jq -r '.html_url' <<< "$run")

            echo "CI status: ${status:-unknown} ${conclusion:-pending} (${url})"

            if [ -z "$run_id" ]; then
              echo "CI run id was missing from GitHub API response."
              exit 1
            fi

            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "CI did not pass for ${HEAD_SHA}: ${conclusion}"
            exit 1
          done

          echo "Timed out waiting for CI to complete for ${HEAD_SHA}."
          exit 1

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The root build also generates all eight Pi extension bundles.
      - name: Build package
        run: pnpm run build

      - name: Check built plugin runtime
        run: pnpm exec vitest run src/plugin-node-runtime.test.ts

      - name: Load Pi bundles and verify packed contents
        timeout-minutes: 2
        run: pnpm run test:pi-extensions

      - name: Publish Pi packages
        id: pi-publish
        run: pnpm publish -r --filter "./pi-packages/*" --ignore-scripts --no-git-checks

      - name: Reconcile Pi releases
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PI_PUBLISH_OUTCOME: ${{ steps.pi-publish.outcome }}
        run: |
          set -uo pipefail
          failed=0
          # Share one propagation deadline across all Pi packages.
          publish_deadline=$((SECONDS + ${PI_PUBLISH_WAIT_SECONDS:-300}))
          notes_file="$(mktemp)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for manifest in pi-packages/*/package.json; do
            dir="$(dirname "$manifest")"
            name="$(node -p "require('./${manifest}').name")"
            version="$(node -p "require('./${manifest}').version")"
            tag="${name}@${version}"

            published=""
            while true; do
              npm_timeout=10
              if [ "$PI_PUBLISH_OUTCOME" = "success" ]; then
                remaining=$((publish_deadline - SECONDS))
                # Once expired, skip checks for all remaining packages (no extra waits).
                if [ "$remaining" -le 0 ]; then break; fi
                if [ "$remaining" -lt "$npm_timeout" ]; then npm_timeout=$remaining; fi
              fi
              # Bound the whole npm process, with 1s grace for TERM-resistant hangs.
              published="$(timeout --kill-after=1s "${npm_timeout}s" npm view "${name}@${version}" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)"
              if [ "$published" = "$version" ] ||
                [ "$PI_PUBLISH_OUTCOME" != "success" ]; then
                break
              fi

              remaining=$((publish_deadline - SECONDS))
              if [ "$remaining" -le 0 ]; then break; fi
              sleep_seconds=10
              if [ "$remaining" -lt "$sleep_seconds" ]; then sleep_seconds=$remaining; fi
              echo "Waiting for ${tag}: npm registry propagation."
              sleep "$sleep_seconds"
            done

            if [ "$published" != "$version" ]; then
              if [ "$PI_PUBLISH_OUTCOME" = "success" ]; then
                echo "Timed out waiting for ${tag}: not visible on npm within the shared 5-minute deadline after successful Pi publish."
                failed=1
              else
                echo "Skipping ${tag}: not published to npm."
              fi
              continue
            fi

            if [ -z "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
              git tag -a "${tag}" -m "Release ${tag}" "$GITHUB_SHA" &&
                git push origin "refs/tags/${tag}" || {
                  echo "Failed to create tag ${tag}."
                  failed=1
                  continue
                }
            fi

            if ! gh release view "${tag}" > /dev/null 2>&1; then
              pnpm tsx scripts/generate-release-notes.ts \
                --tag-prefix "${name}@" \
                --path "${dir}" \
                --to "${tag}" \
                "$notes_file" &&
                gh release create "${tag}" \
                  --verify-tag \
                  --latest=false \
                  --title "${tag}" \
                  --notes-file "$notes_file" || {
                  echo "Failed to create release ${tag}."
                  failed=1
                }
            fi
          done

          exit "$failed"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          pnpm tsx scripts/generate-release-notes.ts
          --exclude-path pi-packages
          --package-tags '@thoth-agents/*@*'
          release-notes.md

      - name: Publish to npm
        run: npm publish --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md

      - name: Create marketplace token
        id: marketplace-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.THOTH_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.THOTH_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thoth-plugins
          permission-contents: write

      - name: Publish marketplace version
        env:
          GH_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        run: |
          gh auth setup-git
          pnpm run release:marketplace
