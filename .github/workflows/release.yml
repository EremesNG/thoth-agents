name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch
        run: |
          for branch in main master; do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done

          for branch in origin/main origin/master; do
            if git show-ref --verify --quiet "refs/remotes/${branch}" &&
              git merge-base --is-ancestor "$GITHUB_SHA" "${branch}"; then
              echo "Release tag commit is contained in ${branch}."
              exit 0
            fi
          done

          echo "Release tags must point to commits contained in main or master."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Update npm
        run: npm install -g npm@11

      - name: Wait for CI
        id: wait-ci
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            runs=$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=20"
            )
            run=$(
              jq \
                --arg tag "${GITHUB_REF_NAME}" \
                --arg sha "${HEAD_SHA}" \
                '.workflow_runs
                  | map(select(.head_branch == $tag and .head_sha == $sha))
                  | sort_by(.created_at)
                  | last // empty' \
                <<< "$runs"
            )

            if [ -z "$run" ]; then
              echo "CI run for tag ${GITHUB_REF_NAME} at ${HEAD_SHA} not found yet. Waiting..."
              sleep 10
              continue
            fi

            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion // empty' <<< "$run")
            run_id=$(jq -r '.database_id' <<< "$run")
            url=$(jq -r '.html_url' <<< "$run")

            echo "CI status: ${status:-unknown} ${conclusion:-pending} (${url})"

            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "CI did not pass for ${HEAD_SHA}: ${conclusion}"
            exit 1
          done

          echo "Timed out waiting for CI to complete for ${HEAD_SHA}."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download package build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.wait-ci.outputs.run_id }}" --name package-build --dir .

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/generate-release-notes.ts release-notes.md

      - name: Publish to npm
        run: npm publish --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
