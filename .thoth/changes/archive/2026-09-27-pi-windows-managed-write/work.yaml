      outputFingerprint: sha256:beae1cba6f4d60767386d858bb51537e43c9012e5711496a4d3c1664a2ec954f
      definitionFingerprint: sha256:c276d82d47a43345f4aa6fd7e7c4fe2c0e20051eaedbbae52c2c7dc45261e103
