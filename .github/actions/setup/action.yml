name: Setup workspace
description: Install the pinned runtimes and frozen workspace dependencies
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.2.2
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.19
        cache: pnpm
    # Match Pi's Bun-compiled release binaries and exercise the bun:sqlite fallback.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
