    output: Coherent minimum-only Pi dependency inventory, installation, status, migration, regression tests and operator documentation.
    dependsOn: []
    reads: [src/cli, package.json, pnpm-lock.yaml, README.md, docs/agent/cli-installation.md, .thoth/specs/cli-installation/spec.md]
    writes: [src/cli, package.json, pnpm-lock.yaml, README.md, docs/agent/cli-installation.md]
    resources: [repository-pi-dependencies]
    owner:
      role: deep
    checks:
      - id: focused-tests
        criterion: Installer and operation regressions cover minimum, newer, old, invalid, missing, migration, filters, dry-run and first-party separation.
        command: pnpm exec vitest run src/cli/pi-install.test.ts src/cli/operations/pi.test.ts src/cli/install.test.ts
      - id: static-checks
        criterion: Formatting, types, build and regression suite pass without unrelated changes.
        command: pnpm run check:ci && pnpm run typecheck && pnpm run build && pnpm test
      - id: native-compatibility
        criterion: Evidence establishes range support at the declared Pi minimum or truthfully reports the compatibility gap before completion.
      - id: independent-review
        criterion: Fresh read-only Oracle verifies actual diff, agreement and check evidence.
