version: 1
change:
  id: pi-dependency-minimums
  title: Allow independent Pi dependency updates with minimum versions
agreement:
  status: approved
  source: user
  ref: "Implementa ese cambio: external Pi dependencies with minimum-only versions"
  approvedBy: user
  fingerprint: sha256:e6ce1467c108764eecc6e897fce1743692048301e7041febbf814f7b3c74630c
goal: Keep all six external Pi extensions mandatory with minimum-only version constraints and allow independent native Pi updates without a Thoth release.
bounds:
  include:
    - Six external Pi dependencies, native installation and migration, installed-version validation, status, tests and documentation
    - Verify native range support at the declared minimum Pi version
  exclude:
    - First-party Thoth exact-version receipts and other harness behavior
    - Global user installation changes, credentials, provider ownership and delegation-runtime replacement
    - Custom update managers or upper version bounds
autonomy:
  allowed:
    - Implement minimum-only ranges using existing versions as initial floors
    - Run local tests and disposable isolated compatibility probes
    - Preserve existing newer satisfying installations and unrelated settings and resource filters
  requiresApproval:
    - Changes to live user installation or unrelated product behavior
  forbidden:
    - Reintroduce exact pins or silently downgrade satisfying dependencies
    - Claim compatibility with arbitrary future releases or unexecuted runtime checks
acceptance:
  - id: minimums
    criterion: All six dependencies remain mandatory with native >= sources; equal and newer installed stable versions satisfy real manifest validation, while missing, invalid and older versions cannot claim readiness; update and status do not demand exact pins.
    inputs: [src/cli/pi-install.ts, src/cli/operations/pi.ts]
    outputs: [src/cli/pi-install.ts, src/cli/pi-install.test.ts, src/cli/operations/pi.ts, src/cli/operations/pi.test.ts]
    checks: [focused-tests, static-checks, independent-review]
    result:
      status: accepted
      reviewedBy: root
