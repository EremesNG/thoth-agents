version: 1
change:
  id: pre-plan-guarantees
agreement:
  status: approved
  fingerprint: sha256:b06e8de96cf37d7f4a9ca8dcae444a302cd309d8e71cf787e14148bf031ed72c
  source: User approved restoring pre-plan guarantees and artifact-free direct work and requested implementation in the current conversation.
goal: Restore classification, exploration, specification and clarification before planning and persistence without restoring SDD document bundles.
bounds:
  include:
    - src/harness/core/workflow.ts
    - src/agents/prompt-sections.ts
    - public workflow and rendered-root regression tests
    - skills/thoth-work and skills/plan-reviewer instructions
    - workflow documentation and AGENTS.md
    - workflow durable specification through declared reviewed archive updates
    - generated plugin and pi assets through the repository generator only
  exclude:
    - scheduler or automatic execution state machine
    - new mandatory discovery or specification documents
    - schema expansion or pretend semantic validation
    - unrelated product behavior and historical OpenSpec records
    - constitution lifecycle changes
    - installations or live harness configuration changes
autonomy:
  allowed:
    - Root implements the coupled contract and instruction changes with TDD at public workflow and rendered-root seams after the planning choice is resolved.
    - Regenerate owned distribution outputs and run local project checks.
    - Use fresh read-only Oracle for selected plan review and mandatory final verification.
    - Prepare a workflow specification replacement and declare its digests before independent verification and archive.
  requiresApproval:
    - Applicable review and implementation planning choices.
    - Material product decisions or expanded scope.
  forbidden:
    - Installing skills or dependencies to obtain workflow contracts.
    - Editing unrelated user or provider assets.
    - Treating delegation count as a persistence requirement.
decisions:
  - id: classification
    statement: Distinguish questions and research from mutations; assess scope, uncertainty, risk, coordination and recovery with bounded inspection.
    rationale: User requires proportional handling rather than a mandatory workflow for every request.
  - id: direct-work
    statement: Clear bounded low-risk changes may be implemented and verified without planning artifacts even with useful delegation; reclassify if new material risk or uncertainty appears.
    rationale: Delegation is independent of persistence and does not itself require work.yaml.
  - id: readiness
    statement: Explore current behavior and constraints, specify desired behavior and acceptance, clarify material decisions, then plan before persisting work.yaml.
    rationale: Preserve SDD reasoning guarantees without document bundles; current workflow.ts plan phase assumes rather than establishes the agreement.
  - id: uncertainty
    statement: Material uncertainty blocks readiness; bounded technical uncertainty needs an explicit resolution strategy and discovery may iterate.
    rationale: Do not claim all uncertainty can be eliminated or silently convert assumptions into requirements.
  - id: clarification
    statement: Investigate repository facts; ask about human-owned decisions and use architectural-grilling only when needed or explicitly requested.
    rationale: Avoid replacing exploration with unnecessary user interrogation.
  - id: ownership
    statement: Root owns the coupled implementation; fresh read-only Oracle verifies after completed implementation and fresh checks.
    rationale: Shared policy, prompts and docs form one reasoning chain; no independent writer output needs parallel dispatch.
  - id: limits
    statement: Keep existing planning choices, authorization, native authority, recovery and independent final verification; readiness is instruction-level without schema expansion.
    rationale: Rendered instructions and structural validation cannot authenticate semantic model compliance.
