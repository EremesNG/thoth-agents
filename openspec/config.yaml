schema: spec-driven
project: thoth-agents
stack: TypeScript, Node.js, pnpm, Biome, OpenCode Plugin SDK

context: |
  thoth-agents is an adaptive orchestration plugin for OpenCode, Codex, and Claude Code.
  It provides seven roles and direct, accelerated, and full Spec Kit-compatible SDD routes.
  thoth-mem is an independent provider plugin and owns its own installation and lifecycle.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  spec:
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Use Given/When/Then scenarios
    - Map every story to named FR/SC contracts
    - Mark every FR as INTERNAL or an explicit durable capability delta
    - Type every SC as buildable or outcome
  design:
    guidance:
      - Document architecture decisions with rationale
      - Require a File Changes section
    sub_artifacts: false            # optional plan sub-artifacts (default off)
    complexity_threshold:
      affected_domains: 3           # >= N delta-spec domains
      affected_files: 12            # >= N files in the File Changes section
      external_research: true       # unresolved tech/library choice present
  tasks:
    guidance:
      - Group tasks by independently testable story and identify the MVP
      - Require T### [P?] [US#?], exact paths, FR/buildable-SC coverage, and Verify outcomes
      - Emit [P] only with a concrete non-overlap example; otherwise explain why none is safe
    tdd: true
    traceability: true
    parallel_markers: conditional
  apply:
    guidance:
      - Follow existing code patterns and conventions
    test_command: ''
  verify:
    test_command: ''
    build_command: ''
    coverage_threshold: 0
    outcome_disposition: pass_evidence_or_residual_risk
  archive:
    - Require closeout PASS before the dated move
    - Transactionally synchronize only declared durable deltas into openspec/specs
    - Roll back handled failures within the active process; do not claim crash atomicity
    - Never synchronize INTERNAL requirements or undeclared prose

  # --- new mechanism sections ---
  constitution:
    path: openspec/memory/constitution.md
    enforce_check: true             # Constitution Check gate blocks on violation
    version_policy: semver          # MAJOR=remove/redefine, MINOR=add, PATCH=clarify
  consistency:
    enforce_block: true             # CRITICAL findings block plan-review
    require_coverage_percentage: true
  requirements_quality:
    enforce_block: true             # incomplete checklist blocks tasks phase
    dimensions: [completeness, clarity, consistency, measurability, coverage]
    domain_lenses: risk-driven
  clarification:
    ask_only_material: true
    max_questions_per_pass: 5
    update_canonical_spec: true
  handoffs:
    surface_hints: true             # surface SddPhaseContract.handoffHints at transitions
