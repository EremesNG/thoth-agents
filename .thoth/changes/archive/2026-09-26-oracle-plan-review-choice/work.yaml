version: 1
change:
  id: "oracle-plan-review-choice"
  title: "Restore Oracle planning choices and bounded unanswered defaults"
agreement:
  status: "approved"
  fingerprint: "sha256:5831592f1c8c02a2bea276ee845d6248a286377361bd3b9dee707a93027e299a"
  source: "User requests 2026-09-26; Oracle review explicitly selected; implementation remains pending post-review choice."
goal: "Preserve the two user-controlled planning choices in the AI-first workflow and recover them after interruption, without returning to pipeline selection."
bounds:
  include:
    - "Ready persisted work plans"
    - "Two bounded native question policies"
    - "Root-owned compact recovery evidence"
    - "Generated harness instructions and declared durable contracts"
  exclude:
    - "New scheduler or question runtime"
    - "Changes to offline work schema or archive algorithm"
    - "Automatic worktrees or merges"
    - "Pi installation or CLI status fixes"
    - "Unrelated current working tree changes"
autonomy:
  allowed:
    - "Prepare and validate planning artifacts"
    - "Read-only Oracle plan review"
    - "After the post-review implementation choice, edit the assigned instruction surfaces, test and rebuild generated packages"
    - "After final Oracle PASS, archive declared durable updates"
  requiresApproval:
    - "Post-Oracle implementation or stop choice"
    - "New material product intent"
    - "Destructive or security-sensitive actions outside scope"
  forbidden:
    - "Assume a still-open question timed out"
    - "Treat Oracle plan approval as final verification"
    - "Modify unrelated changes"
decisions:
  -
    id: "review-selection"
    statement: "User explicitly selected review with Oracle for this change."
    rationale: "Native request_user_input_async response supplied in this conversation."
  -
    id: "ownership"
    statement: "Root owns the coupled policy, documentation and generated instruction surface; fresh Oracle owns read-only plan and final judgments."
    rationale: "One shared policy with ordered consistency work; parallel implementation would duplicate context or overlap generated output."
  -
    id: "recovery-record"
    statement: "Use one compact root-owned evidence/planning.json record for question attempts, choices and approval identity, loaded on planning/resume; it is instruction-level documentary evidence, not a runtime or new work-schema field."
    rationale: "Avoid changing agreement hashes whenever a UI question returns; retain native references without mirroring complete transcripts."
  -
    id: "constitution"
    statement: "Amend project governance from 8.0.0 to 9.0.0, preserving ratification date and recording current amendment date."
    rationale: "The accepted change redefines the human-authority principle by restoring planning decision gates and two bounded defaults."
