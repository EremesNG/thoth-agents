version: 1
change:
  id: pi-agnostic-progress
  title: Make Pi progress tracking optional and provider-neutral
agreement:
  status: approved
  source: user
  ref: User approved removing rpiv-todo and using any available task tool through agnostic instructions
  fingerprint: sha256:fa94dcb523fcd458f8b7fbce91a97d78894a85c4c9c739ce0187c37b47c53fb4
goal: Stop requiring rpiv-todo in Pi and use an available progress tool according to its actual contract, without requiring any task extension.
bounds:
  include:
    - Remove rpiv-todo from mandatory Pi installation, update and status inventory
    - Make Pi root progress guidance optional and provider-neutral, preserving root ownership
    - Update focused tests, public documentation, generated Pi specialists and the two affected durable specifications
  exclude:
    - Changing other harness progress tool contracts or ask-user-question
    - Uninstalling existing user extensions or modifying global Pi configuration
    - Adding an extension detector, compatibility adapter, scheduler or task store
    - Editing historical archived changes
autonomy:
  allowed:
    - Edit scoped source, tests and documentation and regenerate affected package artifacts
    - Run repository checks and isolated tests without live installation
    - Stage explicit reviewed durable specification replacements for archive
  requiresApproval:
    - Live global installation or removal of user packages
  forbidden:
    - Assume every task tool has the same name or arguments
    - Make missing progress tooling block the workflow
acceptance:
  - id: optional-progress
    criterion: Pi install/update/status no longer require rpiv-todo; existing user extensions remain untouched. Root guidance uses an available task tool according to its actual schema, otherwise lightweight written progress; no fixed tool name/API, no change to native lifecycle or canonical work artifacts. Specialists report progress to root. Other harness behavior is preserved.
    inputs: [src/cli/pi-install.ts, src/agents/prompt-dialects.ts, src/agents/prompt-sections.ts, src/harness/adapters/pi.ts]
    outputs: [src/cli/pi-install.ts, src/agents/prompt-dialects.ts, src/agents/prompt-sections.ts, src/harness/adapters/pi.ts, pi, docs/installation.md, docs/skills-and-mcps.md]
    checks: [focused-tests, static-build-regression, independent-review]
