version: 1
change:
  id: example
agreement:
  status: approved
  fingerprint: sha256:replace-with-fingerprint-command
  source: user
goal: Deliver one observable behavior
bounds:
  include: [src/example.ts]
  exclude: [runtime scheduling]
autonomy:
  allowed: [edit assigned files]
  requiresApproval: [destructive actions]
  forbidden: [network access]
acceptance:
  - id: AC-1
    criterion: The public behavior passes its focused test
    inputs: [src/example.test.ts]
    outputs: [src/example.ts]
    checks: [focused test passes]
units:
  - id: implementation
    output: Implement the public behavior
    dependsOn: []
    reads: [src/example.test.ts]
    writes: [src/example.ts]
    resources: []
    owner: { role: worker }
    checks:
      - id: focused-test
        criterion: The focused test passes
        command: pnpm exec vitest run src/example.test.ts
    acceptance: [AC-1]
    baseline: { status: unknown }
    semantic: { status: pending }
