packages:
  - 'pi-packages/*'

allowBuilds:
  '@ast-grep/cli': true
  '@google/genai': false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

overrides:
  hono: 4.12.19
  postcss: 8.5.14
  tsx: 4.22.4

# 4320 = 3 days in minutes
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@earendil-works/*'
  - '@anthropic-ai/claude-agent-sdk*'
