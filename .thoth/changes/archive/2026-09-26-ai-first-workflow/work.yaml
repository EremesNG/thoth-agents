version: 1
change:
  id: "ai-first-workflow"
  title: "Replace narrative SDD with AI-first work contracts"
agreement:
  status: "approved"
  source: "User: Estamos de acuerdo, tenemos una buena base, adelante con la implementación y cambio del actual SDD hacia este nuevo workflow"
  fingerprint: "sha256:0b49d710b8b8a64c2f3e939d6145a231d4392e2367a06feec455866671417f28"
goal: "Replace SDD with a compact AI-first agreement that supports bounded autonomous execution, interruption recovery and useful native parallelism."
bounds:
  include:
    - "Canonical .thoth work contracts and optional context/unit/evidence files"
    - "Offline validation, bounded checkpoints and selective resume projection"
    - "Native harness policies, init, closeout, packaging and durable documentation migration"
  exclude:
    - "Custom runtime, scheduler, job database or provider memory implementation"
    - "Automatic worktrees, merges or deployments"
    - "Backward compatibility with the old workflow"
    - "Changes to preexisting staged benchmark databases"
autonomy:
  allowed:
    - "Implement, test and refine technical details within the accepted design"
    - "Preserve old OpenSpec history and move active governance to .thoth"
    - "Apply explicit reviewed durable updates after independent PASS"
  requiresApproval:
    - "New product intent or material architecture outside this agreement"
    - "Destructive external operations or unavailable secrets"
  forbidden:
    - "Inferring native completion from timeout or checkpoint"
    - "Self-approval by implementation writers"
    - "Weakening acceptance to make checks pass"
decisions:
  -
    id: "D1"
    statement: "Native harness lifecycle is authoritative; Thoth supplies policy and document tooling only"
    rationale: "Avoid reintroducing the removed graph runtime"
  -
    id: "D2"
    statement: "Human agreement concentrates in planning and existing authorization persists"
    rationale: "Execution should not repeat routine approvals"
  -
    id: "D3"
    statement: "Historical OpenSpec records are preserved outside active context"
    rationale: "Keep evidence without burdening each execution"
acceptance:
